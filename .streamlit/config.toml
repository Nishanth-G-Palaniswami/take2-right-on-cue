[theme]
base = "light"
primaryColor = "#2F5D8A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5F7"
textColor = "#1F2933"
font = "sans serif"

[client]
# Hides the Deploy button and the main menu; keeps the page chrome minimal.
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
