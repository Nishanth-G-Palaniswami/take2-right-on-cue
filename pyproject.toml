[project]
name = "rightoncue"
version = "0.1.0"
description = "Next-turn evaluation runner"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.6.1",
    "httpx2>=2.16.2",
    "openai>=3.57.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[project.scripts]
next-turn = "rightoncue.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rightoncue"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
